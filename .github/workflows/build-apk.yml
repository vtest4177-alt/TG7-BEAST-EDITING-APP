name: Build TG7 Editor APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tg7-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TG7 Editor Workspace
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone LibreCuts Base Engine
        run: |
          git clone --depth 1 https://github.com/tharunbirla/LibreCuts.git librecuts-build

      - name: Apply TG7 Editor Rebrand & Black/Neon-Red Gamer Theme
        run: |
          python3 android-tg7/apply_tg7_overlay.py librecuts-build android-tg7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile TG7 Editor Debug APK
        working-directory: librecuts-build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename Output APK
        run: |
          mkdir -p dist-apk
          APK_PATH=$(find librecuts-build/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" dist-apk/TG7-Editor-com.tg7.editor-debug.apk

      - name: Upload TG7 Editor APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG7-Editor-APK
          path: dist-apk/TG7-Editor-com.tg7.editor-debug.apk
          retention-days: 30
