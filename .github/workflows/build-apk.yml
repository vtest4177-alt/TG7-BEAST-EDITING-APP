name: Build TG7 Editor APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tg7-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TG7 Editor Workspace
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build TG7 Editor Web Studio Bundle
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run build
          rm -rf android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/assets
          cp -r dist/* android-app/app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Android 16 (API 36) SDK Platform & Build-Tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile TG7 Editor Android 13-16 APK
        working-directory: android-app
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename Output APK
        run: |
          mkdir -p dist-apk
          APK_PATH=$(find android-app/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" dist-apk/TG7-Editor-com.tg7.editor-Android13-16.apk

      - name: Upload TG7 Editor APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG7-Editor-APK
          path: dist-apk/TG7-Editor-com.tg7.editor-Android13-16.apk
          if-no-files-found: error
          retention-days: 30
